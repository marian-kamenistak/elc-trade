# job.yaml (P3-REGISTRY). Format + rules: agentic-os projects/briefs/automation-visibility/phase2/job-yaml-schema.md
# Check: node ~/ai/_platform/control-room/scripts/registry.ts check <this file>
schema: 1
id: elc-trade
catalogue_id: CF-08 elc-trade
title: ELC trade nightly snapshot (hash-chained)
status: active
streams: [elc]
purpose: sync
entity: null
owner: marian
sender: none
runtime:
  kind: worker
  repo: marian-kamenistak/elc-trade
  path: .
  entry: elc-trade
schedule:
- owner: native
  cron: 15 3 * * *
  tz: UTC
  grace_min: 720
kpi:
  name: nightly snapshot written, chain verifies
  unit: snapshots
  target: 1
  warn: 1
  direction: gte
test:
  command: npm test
  dry_run: set -a && . ~/.env && set +a && npx vite-node scripts/dry-run.ts
autofix:
  allowed: false
  max_attempts: 0
manual_minutes_per_run: 42
manual_minutes_source: estimate
docs: CLAUDE.md
# operating standard (playbook section 14), 2026-11-14
triage: approval
depends_on: []
runbook:
- 'Open the job page and read the last run''s steps: load members and events, aggregate, link hash chain, write to R2.'
- A failed run names the stage and nothing new was written; yesterday's snapshots stay valid, and control-room pages it once.
- 'Attio or Luma down is the usual cause: tomorrow''s run recovers on its own. A hash-chain failure means latest.json fails verification, so do not overwrite it and ask Marian.'
- Pause from the control-room page to stop the nightly run; the live MCP and A2A tools keep serving the last snapshots.
- A repeated run the same day never rewrites a method already written for that day (resume, no forked chain).
inputs:
- name: Attio lists (members, conference) and Luma meetup events
  max_age: 1d
  source: live API reads at run time, nothing cached
budget: null # n.a.: no LLM, credits or paid API (Attio and Luma are read within the plans)
